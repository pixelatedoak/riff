<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b10">
    <title>Riff — connection paused</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(50rem 36rem at 50% -12rem,rgba(139,92,246,.2),transparent 70%),#0b0b10;color:#f4f4f5;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,420px);padding:32px;border:1px solid rgba(255,255,255,.1);border-radius:28px;background:rgba(20,19,26,.9);text-align:center;box-shadow:0 28px 90px rgba(0,0,0,.35)}.mark{width:64px;height:64px;margin:0 auto 22px}.eyebrow{color:#c4b5fd;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:10px 0;font-size:30px;letter-spacing:-.04em}p{color:#a1a1aa;font-size:14px;line-height:1.7}.button{display:inline-flex;margin-top:12px;padding:12px 18px;border-radius:14px;background:#c4b5fd;color:#17121f;font-size:14px;font-weight:700;text-decoration:none}
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/icons/riff-192.png" alt="">
      <div class="eyebrow">A little pause</div>
      <h1>You’re offline.</h1>
      <p>Riff needs a connection to load posts and branches. Your account and posts are safe. Reconnect, then try again.</p>
      <a class="button" href="/">Try again</a>
    </main>
  </body>
</html>
